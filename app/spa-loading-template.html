<div id="spa-loader">
    <div class="spin"></div>
    <style>
        #spa-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spin {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            animation: _spin 0.75s linear infinite;
        }
        @keyframes _spin {
            to { transform: rotate(360deg); }
        }

        html.light #spa-loader { background: #fefefe; }
        html.light .spin { border: 3px solid #e5e7eb; border-top-color: #fab944; }

        html.dark #spa-loader { background: #080912; }
        html.dark .spin { border: 3px solid #696fa5; border-top-color: #fab944; }

        /* Fallback if no class is set yet */
        html:not(.light):not(.dark) #spa-loader { background: #fefefe; }
        html:not(.light):not(.dark) .spin { border: 3px solid #e5e7eb; border-top-color: #fab944; }
    </style>
</div>
